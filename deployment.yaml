
apiVersion: apps/v1
kind: Deployment

metadata:
  name: lw-web
  namespace: lw-week13

spec:
  replicas: 2

  selector:
    matchLabels:
      app: lw-web

  template:
    metadata:
      labels:
        app: lw-web

    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine

          ports:
            - containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
